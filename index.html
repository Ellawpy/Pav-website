        /* ========== PIXEL DITHER DIVIDER ========== */
        function PixelDivider({topColor, bottomColor, accentColor, pxSize=4, seed=0, className='', blendTop=false}) {
            const canvasRef = useRef(null);
            const containerRef = useRef(null);

            useEffect(() => {
                const container = containerRef.current;
                const canvas = canvasRef.current;
                if (!container || !canvas) return;

                const colCache = {};
                const parseCol = (c) => {
                    if (colCache[c]) return colCache[c];
                    const tmp = document.createElement('canvas');
                    tmp.width = tmp.height = 1;
                    const tx = tmp.getContext('2d');
                    tx.fillStyle = c;
                    tx.fillRect(0, 0, 1, 1);
                    colCache[c] = Array.from(tx.getImageData(0, 0, 1, 1).data);
                    return colCache[c];
                };

                const draw = () => {
                    const w = container.clientWidth;
                    const h = container.clientHeight;
                    if (w === 0 || h === 0) return;

                    const cols = Math.ceil(w / pxSize);
                    const rows = Math.ceil(h / pxSize);
                    canvas.width = cols;
                    canvas.height = rows;

                    const ctx = canvas.getContext('2d');
                    if (!ctx) return;

                    let s = seed || 42;
                    const rand = () => { s = (s * 16807 + 0) % 2147483647; return (s & 0x7fffffff) / 0x7fffffff; };

                    const bayer = [
                        [0/16, 8/16, 2/16, 10/16],
                        [12/16, 4/16, 14/16, 6/16],
                        [3/16, 11/16, 1/16, 9/16],
                        [15/16, 7/16, 13/16, 5/16]
                    ];

                    const imgData = ctx.createImageData(cols, rows);
                    const d = imgData.data;

                    if (blendTop) {
                        const botRGB = parseCol(bottomColor);
                        const accentRGB = accentColor ? parseCol(accentColor) : null;
                        const blendStart = 0.35;

                        for (let cy = 0; cy < rows; cy++) {
                            const t = cy / (rows - 1 || 1);
                            const remapped = t <= blendStart ? 0 : (t - blendStart) / (1 - blendStart);
                            const density = remapped * remapped * remapped;
                            if (density <= 0) continue;

                            for (let cx = 0; cx < cols; cx++) {
                                const threshold = bayer[cy % 4][cx % 4];
                                const val = density + rand() * 0.075;
                                const idx = (cy * cols + cx) * 4;

                                if (val > threshold) {
                                    d[idx] = botRGB[0]; d[idx+1] = botRGB[1]; d[idx+2] = botRGB[2]; d[idx+3] = 255;
                                } else if (accentRGB && val > threshold - 0.08 && rand() < 0.08) {
                                    d[idx] = accentRGB[0]; d[idx+1] = accentRGB[1]; d[idx+2] = accentRGB[2]; d[idx+3] = Math.round(255 * (0.3 + rand() * 0.35));
                                }
                            }
                        }
                    } else {
                        const topRGB = parseCol(topColor);
                        const botRGB = parseCol(bottomColor);
                        const accentRGB = accentColor ? parseCol(accentColor) : null;

                        for (let i = 0; i < d.length; i += 4) {
                            d[i] = botRGB[0]; d[i+1] = botRGB[1]; d[i+2] = botRGB[2]; d[i+3] = 255;
                        }

                        for (let cy = 0; cy < rows; cy++) {
                            const t = cy / (rows - 1 || 1);
                            const density = 1 - t * t;

                            for (let cx = 0; cx < cols; cx++) {
                                const threshold = bayer[cy % 4][cx % 4];
                                const val = density + rand() * 0.175;
                                const idx = (cy * cols + cx) * 4;

                                if (val > threshold + 0.08) {
                                    d[idx] = topRGB[0]; d[idx+1] = topRGB[1]; d[idx+2] = topRGB[2]; d[idx+3] = 255;
                                } else if (accentRGB && val > threshold - 0.05 && rand() < 0.12) {
                                    d[idx] = accentRGB[0]; d[idx+1] = accentRGB[1]; d[idx+2] = accentRGB[2]; d[idx+3] = Math.round(255 * (0.4 + rand() * 0.4));
                                }
                            }
                        }
                    }

                    ctx.putImageData(imgData, 0, 0);
                };

                let resizeTimer;
                const debouncedDraw = () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(draw, 100); };

                draw();
                const ro = new ResizeObserver(debouncedDraw);
                ro.observe(container);
                return () => { ro.disconnect(); clearTimeout(resizeTimer); };
            }, [topColor, bottomColor, accentColor, pxSize, seed, blendTop]);

            return (
                <div ref={containerRef} className={`sec-divider ${className}`} style={{background: blendTop ? 'transparent' : bottomColor}}>
                    <canvas ref={canvasRef} style={{imageRendering: 'pixelated'}} />
                </div>
            );
        }

        /* Hero props: drag-and-stay + (hover handled in CSS) */
        function initHeroPropDrag() {
            document.querySelectorAll('.hero-prop:not(.hp-pavpola)').forEach(function(el){
                el.setAttribute('draggable','false');
                var sx, sy, ox, oy;
                function cur(){ return [parseFloat(el.style.getPropertyValue('--tx'))||0, parseFloat(el.style.getPropertyValue('--ty'))||0]; }
                function start(cx, cy){ var c=cur(); ox=c[0]; oy=c[1]; sx=cx; sy=cy; el._moved=false; el.classList.add('dragging'); }
                function moveTo(cx, cy){ if(Math.abs(cx-sx)+Math.abs(cy-sy)>5) el._moved=true; el.style.setProperty('--tx',(ox+cx-sx)+'px'); el.style.setProperty('--ty',(oy+cy-sy)+'px'); }
                el.addEventListener('click', function(e){ if(el._moved){ e.preventDefault(); e.stopPropagation(); } });
                el.addEventListener('mousedown', function(e){
                    e.preventDefault(); start(e.clientX, e.clientY);
                    function mm(ev){ moveTo(ev.clientX, ev.clientY); }
                    function mu(){ el.classList.remove('dragging'); window.removeEventListener('mousemove',mm); window.removeEventListener('mouseup',mu); }
                    window.addEventListener('mousemove',mm); window.addEventListener('mouseup',mu);
                });
                el.addEventListener('touchstart', function(e){
                    var t=e.touches[0]; start(t.clientX, t.clientY);
                    function tm(ev){ var t2=ev.touches[0]; moveTo(t2.clientX, t2.clientY); ev.preventDefault(); }
                    function te(){ el.classList.remove('dragging'); window.removeEventListener('touchmove',tm); window.removeEventListener('touchend',te); }
                    window.addEventListener('touchmove',tm,{passive:false}); window.addEventListener('touchend',te);
                }, {passive:true});
            });
        }
        setTimeout(initHeroPropDrag, 500);
    </script>
